version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # cassandra-all pins the supported JDK range and the shape of cu-cassandra.yaml, so it is
      # upgraded deliberately and never by a bot. 5.1/6.0 will need the yaml revisited and will
      # change which JDKs work at all.
      - dependency-name: "org.apache.cassandra:cassandra-all"
      - dependency-name: "org.apache.cassandra:cassandra-parent"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly

  # The docs site toolchain pinned in requirements-docs.txt.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      # MkDocs 2.0 removes the plugin system and rewrites theming, with no migration path, and
      # mkdocs-material does not support it. A major bump here would break the docs build
      # outright, so it is upgraded deliberately and never by a bot. Minor and patch are fine.
      # https://squidfunk.github.io/mkdocs-material/blog/2026/02/18/mkdocs-2.0/
      - dependency-name: "mkdocs"
        update-types: [ "version-update:semver-major" ]
