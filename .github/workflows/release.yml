name: release

# Releases are cut here, not from a laptop. The job declares `environment: central`, so it stops
# and waits for a human to approve before it can touch Maven Central.
#
# Order of operations matters and is not obvious: `useReleaseProfile=false` plus
# `releaseProfiles=release` in the pom means the `release` profile - source jar, javadoc jar, gpg
# signing - is only active during `release:perform`, while `release:prepare` runs a plain
# `clean verify`. So a bad GPG key or a javadoc error would surface only *after* main had been
# bumped and the tag pushed. The pre-flight step below runs the release profile first, with
# nothing pushed, so those failures cost nothing.

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Version to release, e.g. 5.0.0'
        required: true
      developmentVersion:
        description: 'Next development version, e.g. 5.0.1-SNAPSHOT'
        required: true
      dryRun:
        description: 'dry run'
        type: boolean
        default: true

# Two releases at once would fight over the tag and the version bump.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # release:prepare pushes two commits and a tag to main

jobs:
  release:
    runs-on: ubuntu-latest
    environment: central

    steps:
      - uses: actions/checkout@v4
        with:
          # release:prepare commits on top of the branch, so the full history is wanted.
          # persist-credentials stays at its default: checkout writes an http.extraheader into
          # the local git config, and maven-scm's `git push <developerConnection url>` picks it
          # up because the URL prefix matches. That is what authenticates the push.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # Writes ~/.m2/settings.xml with a <server> whose id matches the pom's
          # <publishingServerId>central</publishingServerId>. Do not switch to an explicit
          # `-s some/settings.xml`: release:perform forks a fresh Maven inside target/checkout,
          # and that fork reads the default settings location.
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}

      # The same `full-` prefix build.yml's main job writes, on purpose: this builds the same
      # reactor, so it should restore what that job cached on the last push to main. build.yml
      # saves after its snapshot deploy, so the publishing plugin's tree is in there too.
      #
      # restore-keys is doing the real work here. The key hashes every pom, and release:prepare
      # rewrites them - the released version is a fresh hash by definition - so this job can never
      # get an exact hit. A prefix hit restores a nearly complete repository anyway. That is also
      # why this is not setup-java's `cache: maven`, which exposes no restore-keys.
      - name: Cache the Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-full-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-full-${{ runner.os }}-

      - name: Configure git identity
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # The GitHub release notes are the CHANGELOG's `## Unreleased` section, verbatim - the entries
      # there are written by hand and read better than anything generated from commit subjects.
      # Pulling and checking them here, in the pre-flight phase, means an empty or already-promoted
      # changelog costs a failed job and nothing else.
      #
      # This has to stay *ahead* of the stamping step below, which empties `## Unreleased`. Moved
      # down next to the `gh release create` that consumes the file, it would silently produce empty
      # release notes: the guards below would have already passed, and `gh` takes an empty
      # --notes-file without complaint.
      - name: Extract the release notes from the CHANGELOG
        env:
          VERSION: ${{ inputs.releaseVersion }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          awk '/^## Unreleased[[:space:]]*$/{f=1;next} /^## /{f=0} f' CHANGELOG.md > "$notes"

          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::CHANGELOG.md has an empty '## Unreleased' section. Write the notes for $VERSION before releasing."
            exit 1
          fi
          if grep -q "^## ${VERSION} " CHANGELOG.md; then
            echo "::error::CHANGELOG.md already has a '## ${VERSION}' section - either the version is being reused, or '## Unreleased' was promoted by hand. Revert that and let this workflow stamp it."
            exit 1
          fi

          # So a dry run shows exactly what the real run would publish.
          {
            echo "## Release notes for ${VERSION}"
            echo
            cat "$notes"
          } >> "$GITHUB_STEP_SUMMARY"

      # Everything that can fail, failing while nothing has been pushed: gpg signing, the javadoc
      # jar Central requires, the source jar, and the full test suite.
      - name: Pre-flight (release profile, nothing published)
        run: mvn -B -Prelease verify
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      # Rehearsal. Writes pom.xml.tag / pom.xml.next next to the poms and stops there.
      #
      # -Darguments reaches the Maven that release:prepare forks for its `clean verify`, so this
      # skips the suite there. The pre-flight above already ran it against this commit, and the
      # only thing prepare changes is the version string in the pom, which cannot change a test
      # outcome. Everything a dry run exists to rehearse still runs: compile, enforcer, packaging
      # and the pom transformation. Without this the job tests twice and takes about twice as long.
      - name: Dry run
        if: ${{ inputs.dryRun }}
        run: |
          mvn -B release:clean release:prepare \
            -DdryRun=true \
            -DpushChanges=false \
            -Darguments="-DskipTests" \
            -DreleaseVersion=${{ inputs.releaseVersion }} \
            -DdevelopmentVersion=${{ inputs.developmentVersion }}
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      # Stamp the changelog before `release:prepare` runs, so the tag it creates points at a tree
      # whose CHANGELOG names the version being released.
      #
      # Committing is not a style choice - `release:prepare` aborts on a dirty working tree. Not
      # pushing is: `prepare` pushes the branch, so this commit rides along with its own two, and
      # nothing reaches `main` if `prepare` fails first. The push is asserted after the fact below,
      # because `-DpushChanges=false` means the dry run cannot rehearse it.
      #
      # `## Unreleased` is left with no subsections on purpose. That empty block is what makes the
      # guard in the extract step bite on the next release: no notes, no release. Do not seed it
      # with `### Added` / `### Changed` placeholders.
      - name: Stamp the CHANGELOG
        if: ${{ !inputs.dryRun }}
        env:
          VERSION: ${{ inputs.releaseVersion }}
        run: |
          heading="## ${VERSION} ($(date -u +%Y-%m-%d))"
          awk -v h="$heading" '
            !stamped && /^## Unreleased[[:space:]]*$/ { print; print ""; print h; stamped=1; next }
            { print }
          ' CHANGELOG.md > CHANGELOG.md.tmp
          mv CHANGELOG.md.tmp CHANGELOG.md
          git add CHANGELOG.md
          git commit -m "docs: changelog for ${VERSION}"

      # The real thing. prepare: set version, run `clean verify`, commit, tag, push, bump to the
      # next snapshot, push. perform: clone the tag, build it with -Prelease, upload to Central.
      #
      # -Darguments is passed to the Maven that *both* goals fork, so it skips the suite in
      # prepare's `clean verify` as well as in perform's build. That is deliberate: the pre-flight
      # above is the one run of the suite for this commit, and repeating an embedded-Cassandra
      # suite that takes a couple of minutes proves nothing the pre-flight did not already prove.
      - name: Release
        if: ${{ !inputs.dryRun }}
        run: |
          mvn -B release:clean release:prepare release:perform \
            -DreleaseVersion=${{ inputs.releaseVersion }} \
            -DdevelopmentVersion=${{ inputs.developmentVersion }} \
            -Darguments="-DskipTests"
        env:
          # settings.xml written by setup-java resolves these by name; release:perform forks
          # a fresh Maven in target/checkout, which inherits this environment.
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      # The one branch of this design a dry run cannot exercise: whether `prepare`'s push carried the
      # changelog commit. Left unchecked it fails quietly - the release still succeeds, only the
      # stamp is lost, and the next release would republish these notes under the next version.
      - name: Check the CHANGELOG commit reached main
        if: ${{ !inputs.dryRun }}
        env:
          VERSION: ${{ inputs.releaseVersion }}
        run: |
          git fetch --quiet origin main
          if ! git log --format=%s origin/main | grep -qxF "docs: changelog for ${VERSION}"; then
            echo "::error::'docs: changelog for ${VERSION}' is not on origin/main - release:prepare's push did not carry it. Push it by hand before the next release."
            exit 1
          fi

      - name: Draft the GitHub release
        if: ${{ !inputs.dryRun }}
        env:
          VERSION: ${{ inputs.releaseVersion }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="cassandra-unit-parent-${VERSION}"

          # That name is maven-release-plugin's default, @{project.artifactId}-@{project.version},
          # because no pom sets <tagNameFormat>. Assert it against the remote rather than trusting
          # the default to hold: if someone adds a tagNameFormat later, this fails loudly instead of
          # drafting a release against a tag that does not exist. release.properties would carry the
          # real name, but release:perform deletes that file.
          git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null

          # Re-checked at the point of use, not just where it was written: `gh` accepts an empty
          # --notes-file silently, so a lost or clobbered file would publish a blank release.
          notes="$RUNNER_TEMP/release-notes.md"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::${notes} is missing or empty - the extract step ran but its output did not survive to here."
            exit 1
          fi

          {
            echo
            echo "---"
            echo
            echo "**Maven Central:** <https://central.sonatype.com/artifact/org.cassandraunit/cassandra-unit/${VERSION}>"
          } >> "$notes"
          prev=$(git describe --tags --abbrev=0 --match 'cassandra-unit-parent-*' "${tag}^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            echo "**Full commit log:** <https://github.com/jsevellec/cassandra-unit/compare/${prev}...${tag}>" >> "$notes"
          fi

          # A draft, not a published release. `autoPublish` is false in the pom, so Central sits at
          # VALIDATED until a human presses Publish, and a deployment can still be dropped for free.
          # Publishing this now would announce a version that might never ship. Publish it in the
          # same sitting as the Portal.
          gh release create "$tag" \
            --draft \
            --verify-tag \
            --title "$VERSION" \
            --notes-file "$notes"

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-release
          path: '**/target/surefire-reports/**'

      - name: How to recover
        if: failure() && !inputs.dryRun
        run: |
          cat <<'EOF'
          The release failed. Check, in this order:

            git log --oneline origin/main -4     # did prepare push its two commits, and the
                                                 # 'docs: changelog for <version>' commit under them?
            git ls-remote --tags origin          # did it push cassandra-unit-parent-<version>?
            https://central.sonatype.com         # is there a deployment, and in what state?
            gh release list                      # was the draft release created?

          If prepare pushed but perform failed, the version number is still recoverable only if
          nothing was published. Undo with:

            mvn release:rollback                 # reverts the version commits (needs the local clone)
            git push --delete origin cassandra-unit-parent-<version>

          release:rollback does NOT touch the changelog commit. If it was pushed, revert it too, or
          the next release starts from a CHANGELOG with an empty '## Unreleased' and refuses to run:

            git revert --no-edit <sha of "docs: changelog for <version>">

          If everything up to and including the upload worked and only the release step failed, the
          tag and the changelog are fine and only the draft is missing. Recreate it with the
          '## <version>' section of CHANGELOG.md as the body:

            awk '/^## <version> /{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
            gh release create cassandra-unit-parent-<version> --draft --verify-tag \
              --title <version> --notes-file notes.md

          A deployment left sitting in the Portal can be dropped from the Deployments page at no
          cost. A *published* version cannot be removed or reused.
          EOF
