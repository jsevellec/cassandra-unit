name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # JDK 17 only for the full reactor, and this is the complete set. Cassandra 5.0 supports
        # 11 and 17, but maven.compiler.release is 17 and spring-test 6.2 requires 17 anyway. Do
        # not add 21 or later here: no released Cassandra supports 18-23, and Cassandra's
        # ThreadAwareSecurityManager calls System::setSecurityManager, which throws on JDK 24+.
        # maven-enforcer-plugin rejects anything outside [17,18) with a readable message.
        #
        # cassandra-unit-dataset has no such ceiling, and the dataset-on-newer-jdks job below is
        # what keeps that claim honest.
        java: [ '17' ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          # Writes ~/.m2/settings.xml with a <server> matching the pom's
          # <publishingServerId>central</publishingServerId>, so the snapshot deploy below has
          # credentials. Harmless on pull requests, where that step does not run.
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD

      # Each test class forks a JVM that starts a real embedded Cassandra, so the suite is
      # slower than the source size suggests. -B keeps the log readable in CI.
      - name: Build and test
        run: mvn -B verify

      # Publishes SNAPSHOTs from main so the unreleased version is usable without building from
      # source. Reuses the build that just passed rather than running a second one.
      #
      # Both guards are load-bearing. release:prepare pushes a commit whose pom carries the
      # *release* version, and without them this step would push an unsigned, unapproved release
      # to Central. Releases go through .github/workflows/release.yml, which signs them and waits
      # for a human.
      #
      # No -Prelease: Central does not require signatures on snapshots, so this stays fast and
      # needs no GPG key - which is why those secrets live in the gated `central` environment
      # instead of at repo level.
      - name: Deploy snapshot
        if: >
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          !contains(github.event.head_commit.message, '[maven-release-plugin]')
        run: |
          version=$(mvn -B -q -DforceStdout -Dexpression=project.version \
            org.apache.maven.plugins:maven-help-plugin:3.5.1:evaluate)
          case "$version" in
            *-SNAPSHOT)
              echo "Deploying $version to the Central snapshot repository"
              mvn -B -DskipTests deploy
              ;;
            *)
              echo "Version $version is not a snapshot - skipping. Releases go through release.yml."
              ;;
          esac
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-java${{ matrix.java }}
          path: '**/target/surefire-reports/**'

  # The claim cassandra-unit-dataset is sold on: it starts no Cassandra daemon, so it is not bound
  # to JDK 17 the way cassandra-unit is. Asserting that in a README is cheap; running it is not
  # much dearer, and this is the only thing that would notice if a future change quietly pulled
  # the embedded server back in.
  #
  # Only -pl cassandra-unit-dataset. Building the whole reactor here would fail by design: the
  # enforce-jdk rule on cassandra-unit and cassandra-unit-spring rejects anything but 17.
  dataset-on-newer-jdks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '21', '25' ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # -am builds the parent pom, which cassandra-unit-dataset needs to resolve. The parent
      # carries no JDK rule - enforce-jdk lives on the two modules that start a daemon - so this
      # resolves on any JDK.
      - name: Build and test the dataset module
        run: mvn -B -pl cassandra-unit-dataset -am verify

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-dataset-java${{ matrix.java }}
          path: 'cassandra-unit-dataset/target/surefire-reports/**'
