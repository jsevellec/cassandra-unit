# Minimal Cassandra 5.0 configuration for an embedded, single-node, throwaway test instance.
#
# Derived from Apache Cassandra's own in-JVM test config (test/conf/cassandra.yaml at tag
# cassandra-5.0.8), NOT from conf/cassandra.yaml. Cassandra's YamlConfigurationLoader rejects
# unknown properties, so every key here is deliberate and was checked against
# org.apache.cassandra.config.Config at that tag. Anything Cassandra already defaults sanely
# is intentionally absent - the 589-line file this replaces was mostly restating defaults,
# plus Thrift-era keys that no longer load at all.
#
# Two things deliberately differ from Cassandra's test config:
#   - Murmur3Partitioner, not ByteOrderedPartitioner. BOP only exists so Cassandra's own
#     suite can assert ordering; it is the wrong default for anybody else.
#   - Non-default ports (see below).
#
# The `memtable: configurations:` block from Cassandra's test config is deliberately omitted:
# it contains intentionally-invalid entries (class_name: "", class_name: NotExisting,
# invalid: throw) that exist so Cassandra can assert its own error handling.

cluster_name: 'Test Cluster'
partitioner: org.apache.cassandra.dht.Murmur3Partitioner
endpoint_snitch: SimpleSnitch
num_tokens: 1

# Ports are deliberately NOT the Cassandra defaults, so that an embedded instance does not
# collide with a Cassandra the developer happens to be running locally on 9042/7000.
# A value of 0 means "pick a free port at startup" (see CASSANDRA_RNDPORT_YML_FILE).
storage_port: 7010
ssl_storage_port: 7011
native_transport_port: 9142
start_native_transport: true
listen_address: 127.0.0.1
rpc_address: localhost

# The seed is given WITHOUT a port on purpose. SimpleSeedProvider resolves a bare host via
# InetAddressAndPort.getByName, which fills in storage_port - so this stays correct even when
# storage_port is randomised. Writing "127.0.0.1:7010" here would silently desynchronise.
seed_provider:
    - class_name: org.apache.cassandra.locator.SimpleSeedProvider
      parameters:
          - seeds: "127.0.0.1"

# Paths. These are overwritten at startup from the caller's tmpDir, so treat them as
# placeholders rather than as the effective values.
data_file_directories:
    - target/embeddedCassandra/data
commitlog_directory: target/embeddedCassandra/commitlog
saved_caches_directory: target/embeddedCassandra/saved_caches
hints_directory: target/embeddedCassandra/hints
cdc_raw_directory: target/embeddedCassandra/cdc_raw
cdc_enabled: false

# Durability is pointless for a throwaway instance, and fsync dominates startup cost.
commitlog_sync: periodic
commitlog_sync_period: 10s
commitlog_segment_size: 5MiB
auto_snapshot: false
incremental_backups: false

# Keep everything on heap and out of native allocators: embedded tests are short-lived, and
# off-heap/native paths are the ones that break across platforms (notably Apple Silicon).
memtable_allocation_type: heap_buffers
disk_access_mode: standard
column_index_size: 4KiB

# Features that tests legitimately exercise and that are gated off by default in 4.x+.
user_defined_functions_enabled: true
materialized_views_enabled: true
sasi_indexes_enabled: true
drop_compact_storage_enabled: true
